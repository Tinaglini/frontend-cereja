<div class="login-container fade-in">
  <div class="login-overlay"></div>
  
  <div class="login-wrapper">
    <!-- Lado Esquerdo: Branding/Imagem -->
    <div class="login-brand-side d-none d-lg-flex">
      <div class="brand-content fade-in-down">
        <div class="logo-wrapper mb-4">
          <!-- SVG Logo Tia Cereja -->
          <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-accent" style="fill: currentColor;">
            <!-- Laço/Fita -->
            <path d="M32 18C28 14 20 12 16 18C12 24 16 30 24 32C16 34 12 40 16 46C20 52 28 50 32 46C36 50 44 52 48 46C52 40 48 34 40 32C48 30 52 24 48 18C44 12 36 14 32 18Z" fill="currentColor" opacity="0.9"/>
            <circle cx="32" cy="32" r="6" fill="currentColor"/>
            <!-- Cabinhos -->
            <path d="M22 46C22 36 30 32 30 32" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M42 46C42 36 34 32 34 32" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
            <!-- Cereja Esquerda -->
            <circle cx="20" cy="50" r="8" fill="currentColor"/>
            <!-- Cereja Direita -->
            <circle cx="44" cy="50" r="8" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="brand-title">Tia Cereja</h1>
        <p class="brand-subtitle">Elegância e organização para eventos inesquecíveis.</p>
      </div>
    </div>

    <!-- Lado Direito: Formulário -->
    <div class="login-form-side">
      <div class="login-card scale-up">
        
        <div class="login-header text-center d-lg-none mb-4">
          <!-- SVG Logo Tia Cereja Mobile -->
          <svg width="40" height="40" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-accent mb-2" style="fill: currentColor;">
            <path d="M32 18C28 14 20 12 16 18C12 24 16 30 24 32C16 34 12 40 16 46C20 52 28 50 32 46C36 50 44 52 48 46C52 40 48 34 40 32C48 30 52 24 48 18C44 12 36 14 32 18Z" fill="currentColor" opacity="0.9"/>
            <circle cx="32" cy="32" r="6" fill="currentColor"/>
            <path d="M22 46C22 36 30 32 30 32" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M42 46C42 36 34 32 34 32" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
            <circle cx="20" cy="50" r="8" fill="currentColor"/>
            <circle cx="44" cy="50" r="8" fill="currentColor"/>
          </svg>
          <h2 class="login-title-mobile">Tia Cereja</h2>
        </div>

        <div class="form-header mb-4">
          <h3 class="fw-bold text-dark">Bem-vindo</h3>
          <p class="text-muted">Faça login para gerenciar o sistema</p>
        </div>
        
        <form class="login-form" (ngSubmit)="login()" #loginForm="ngForm">
          <!-- Floating Label MDB/Bootstrap 5 -->
          <div class="form-floating mb-4">
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              [(ngModel)]="credentials.login" 
              name="login"
              required
              email
              placeholder="nome@exemplo.com">
            <label for="email"><i class="fas fa-envelope me-2 text-muted"></i>Email</label>
          </div>
          
          <div class="form-floating mb-4">
            <input 
              type="password" 
              class="form-control" 
              id="senha" 
              [(ngModel)]="credentials.senha" 
              name="senha"
              required
              placeholder="Senha">
            <label for="senha"><i class="fas fa-lock me-2 text-muted"></i>Senha</label>
          </div>
          
          <button 
            type="submit" 
            class="btn btn-primary btn-login w-100 mt-2"
            [disabled]="loginForm.invalid || loading">
            <span *ngIf="!loading">
              Acessar Sistema <i class="fas fa-arrow-right ms-2"></i>
            </span>
            <span *ngIf="loading">
              <i class="fas fa-spinner fa-spin me-2"></i> Entrando...
            </span>
          </button>
        </form>
        
        <div class="login-footer text-center mt-5">
          <p class="text-muted small">
            &copy; 2026 Tia Cereja. Todos os direitos reservados.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

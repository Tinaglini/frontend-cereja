<div class="perfil-container fade-in py-3" style="max-width: 800px; margin: 0 auto;">
  
  <div class="d-flex justify-content-between align-items-end mb-4 pb-3 border-bottom border-black border-opacity-10">
    <div>
      <h2 class="display-font text-dark mb-1">Meu Perfil</h2>
      <p class="text-muted mb-0">Gerencie suas informações pessoais.</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden mt-4">
    <!-- Header visual -->
    <div class="bg-primary pt-5 pb-5 position-relative">
       <div class="position-absolute bottom-0 start-50 translate-middle-x" style="margin-bottom: -50px;">
          <img src="https://ui-avatars.com/api/?name={{ usuario.nome }}&background=E5E7EB&color=0D8ABC&rounded=true&size=120" 
               class="rounded-circle shadow border border-4 border-white" alt="Avatar"/>
       </div>
    </div>
    
    <div class="card-body pt-5 mt-4 px-md-5 pb-5">
       <h4 class="text-center fw-bold text-dark mb-1">{{ usuario.nome }}</h4>
       <p class="text-center text-muted small mb-4">{{ usuario.email }}</p>

       <form (ngSubmit)="salvarPerfil()">
         <div class="row g-4 mt-2">
            
            <div class="col-md-6">
              <label class="form-label text-muted fw-bold small text-uppercase">Nome Completo</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input type="text" class="form-control bg-light border-start-0 ps-0" [(ngModel)]="usuario.nome" name="nome" placeholder="Seu nome">
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label text-muted fw-bold small text-uppercase">Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" class="form-control bg-light border-start-0 ps-0" [(ngModel)]="usuario.email" name="email" disabled title="E-mail de acesso não pode ser alterado">
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label text-muted fw-bold small text-uppercase">Telefone / WhatsApp</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-phone text-muted"></i></span>
                <input type="tel" class="form-control bg-light border-start-0 ps-0" [(ngModel)]="usuario.telefone" name="tel" placeholder="(00) 00000-0000">
              </div>
            </div>

         </div>

         <div class="text-end mt-5 pt-3 border-top">
            <button type="submit" class="btn btn-primary px-5 shadow-sm">
               <i class="fas fa-save me-2"></i> Salvar Alterações
            </button>
         </div>
       </form>

    </div>
  </div>

</div>

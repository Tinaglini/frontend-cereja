<header class="top-header">
  <div class="header-left">
    <button class="btn-toggle d-none d-lg-block" (click)="onToggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
    <div class="page-title ms-3 d-none d-md-block">
      <h5 class="mb-0 fw-bold text-dark">Gestão de Festas</h5>
      <small class="text-muted">Painel Administrativo</small>
    </div>
  </div>

  <div class="header-right">
    <!-- Barra de Busca -->
    <div class="search-container" *ngIf="isLoggedIn">
      <div class="search-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input 
          type="text" 
          class="search-input" 
          [(ngModel)]="termoBusca"
          (input)="onBuscaChange()"
          (focus)="onBuscaFocus()"
          (blur)="onBuscaBlur()"
          placeholder="Buscar orçamentos..."
          autocomplete="off">
        <button class="search-clear" *ngIf="termoBusca" (click)="limparBusca()" type="button">
          <i class="fas fa-times"></i>
        </button>
        <div class="search-spinner" *ngIf="buscando">
          <i class="fas fa-spinner fa-spin"></i>
        </div>
      </div>
      
      <!-- Dropdown de Resultados -->
      <div class="search-results" *ngIf="mostrarResultados && resultados.length > 0">
        <div class="search-result-item" *ngFor="let resultado of resultados" (click)="selecionarResultado(resultado)">
          <div class="result-icon">
            <i class="fas" [ngClass]="resultado.tipo === 'cliente' ? 'fa-user' : 'fa-palette'"></i>
          </div>
          <div class="result-content">
            <div class="result-title">{{ resultado.titulo }}</div>
            <div class="result-subtitle" *ngIf="resultado.subtitulo">{{ resultado.subtitulo }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- User Dropdown -->
    <div class="user-profile dropdown" *ngIf="isLoggedIn">
      <button class="btn-user dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="avatar">
          <span class="initial">{{ getUserDisplayName().charAt(0).toUpperCase() }}</span>
        </div>
        <div class="user-info d-none d-md-block">
          <span class="user-name">{{ getUserDisplayName() }}</span>
        </div>
      </button>
      
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li class="dropdown-header">
          <div class="d-flex flex-column">
            <span class="fw-bold">{{ getUserDisplayName() }}</span>
            <small class="text-muted">{{ currentUser?.email }}</small>
          </div>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Meu Perfil</a></li>
        <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i>Configurações</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" (click)="logout(); $event.preventDefault()">
          <i class="fas fa-sign-out-alt me-2"></i>Sair
        </a></li>
      </ul>
    </div>

    <div class="user-profile" *ngIf="!isLoggedIn">
      <button class="btn btn-primary" routerLink="/login">Login</button>
    </div>
  </div>
</header>
